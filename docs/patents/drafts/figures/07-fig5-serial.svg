  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#000"/></marker></defs>
  <rect x="0" y="0" width="720" height="360" fill="#fff"/>
  <rect x="40" y="30" width="220" height="46" fill="#fff" stroke="#000"/><text x="150" y="58" text-anchor="middle">識別子＋個体番号</text>
