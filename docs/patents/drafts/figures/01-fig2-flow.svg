<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="IPAGothic, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="560" fill="#fff"/>

  <!-- Box1 -->
  <rect x="160" y="20" width="440" height="48" fill="#fff" stroke="#000"/>
  <text x="380" y="49" text-anchor="middle">第1記録：各事業者が証跡ハッシュを個別アンカー→tx識別子保持</text>
  <line x1="380" y1="68" x2="380" y2="96" stroke="#000" marker-end="url(#arrow)"/>

  <!-- Box2 -->
  <rect x="180" y="96" width="400" height="48" fill="#fff" stroke="#000"/>
  <text x="380" y="125" text-anchor="middle">収集：正規化VINで横断収集（除外設定は除く）</text>
  <line x1="380" y1="144" x2="380" y2="172" stroke="#000" marker-end="url(#arrow)"/>

  <!-- Box3 -->
  <rect x="120" y="172" width="520" height="48" fill="#fff" stroke="#000"/>
  <text x="380" y="201" text-anchor="middle">算出：小文字化・重複排除・昇順ソート→VINと連結→集約ダイジェスト</text>
  <line x1="380" y1="220" x2="380" y2="252" stroke="#000" marker-end="url(#arrow)"/>

  <!-- Decision diamond -->
  <polygon points="380,252 500,300 380,348 260,300" fill="#fff" stroke="#000"/>
  <text x="380" y="304" text-anchor="middle">既記録と一致？</text>

  <!-- Right branch: 一致 -->
  <line x1="500" y1="300" x2="600" y2="300" stroke="#000" marker-end="url(#arrow)"/>
  <text x="548" y="292" text-anchor="middle">一致</text>
  <rect x="600" y="276" width="150" height="48" fill="#fff" stroke="#000"/>
  <text x="675" y="305" text-anchor="middle">第2記録しない（冪等）</text>

  <!-- Down branch: 不一致 -->
  <line x1="380" y1="348" x2="380" y2="384" stroke="#000" marker-end="url(#arrow)"/>
  <text x="410" y="370" text-anchor="middle">不一致</text>
  <rect x="140" y="384" width="480" height="48" fill="#fff" stroke="#000"/>
  <text x="380" y="413" text-anchor="middle">第2記録：単一トランザクションで集約ダイジェストを記録</text>

  <!-- failure retry (dashed) -->
  <line x1="380" y1="432" x2="380" y2="468" stroke="#000" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="430" y="454" text-anchor="middle">失敗時</text>
  <rect x="140" y="468" width="480" height="48" fill="#fff" stroke="#000"/>
  <text x="380" y="497" text-anchor="middle">集約ダイジェスト保持・tx空欄→定期処理で再試行</text>

  <text x="20" y="540" font-size="12">図2（発明01：個別アンカー→集約アンカーの処理フロー）</text>
</svg>
