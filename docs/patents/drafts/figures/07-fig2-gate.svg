<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="540" fill="#fff"/>

  <!-- Box1 -->
  <rect x="210" y="20" width="340" height="44" fill="#fff" stroke="#000"/>
  <text x="380" y="47" text-anchor="middle">装着済み：内容・証拠を登録</text>
  <line x1="380" y1="64" x2="380" y2="90" stroke="#000" marker-end="url(#arrow)"/>

  <!-- Box2 -->
  <rect x="190" y="90" width="380" height="44" fill="#fff" stroke="#000"/>
  <text x="380" y="117" text-anchor="middle">確認要求（宛先＝連絡先の出所ルールで決定）</text>
  <line x1="380" y1="134" x2="380" y2="160" stroke="#000" marker-end="url(#arrow)"/>

  <!-- Box3 -->
  <rect x="190" y="160" width="380" height="44" fill="#fff" stroke="#000"/>
  <text x="380" y="187" text-anchor="middle">利用者が自端末でOTP→電話所持を証明</text>
  <line x1="380" y1="204" x2="380" y2="230" stroke="#000" marker-end="url(#arrow)"/>

  <!-- Box4 -->
  <rect x="160" y="230" width="440" height="44" fill="#fff" stroke="#000"/>
  <text x="380" y="257" text-anchor="middle">内容ハッシュ＋所持証明値に署名＋TSA時刻トークン</text>
  <line x1="380" y1="274" x2="380" y2="300" stroke="#000" marker-end="url(#arrow)"/>

  <!-- Diamond -->
  <polygon points="380,300 560,348 380,396 200,348" fill="#fff" stroke="#000"/>
  <text x="380" y="343" text-anchor="middle" font-size="12">DB制約：(a)署名一致 ＆ (b)所持一致</text>
  <text x="380" y="361" text-anchor="middle" font-size="12">＆ (c)保証グレード充足？</text>

  <!-- 欠落 (bottom-left) -->
  <line x1="300" y1="372" x2="190" y2="440" stroke="#000" marker-end="url(#arrow)"/>
  <text x="225" y="410" text-anchor="middle" font-size="12">欠落</text>
  <rect x="30" y="440" width="320" height="56" fill="#fff" stroke="#000"/>
  <text x="190" y="465" text-anchor="middle" font-size="12">例外発生・遷移拒否</text>
  <text x="190" y="483" text-anchor="middle" font-size="12">（特権アカウントも例外なし）</text>

  <!-- 充足 (bottom-right) -->
  <line x1="460" y1="372" x2="570" y2="440" stroke="#000" marker-end="url(#arrow)"/>
  <text x="535" y="410" text-anchor="middle" font-size="12">全て充足</text>
  <rect x="410" y="440" width="320" height="56" fill="#fff" stroke="#000"/>
  <text x="570" y="465" text-anchor="middle" font-size="12">利用者確認済み</text>
  <text x="570" y="483" text-anchor="middle" font-size="12">（完全凍結）</text>

  <text x="20" y="522" font-size="12">図2（発明07：本人所持証明に束ねたDB層の確定ゲート）</text>
</svg>
