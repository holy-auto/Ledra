name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint-typecheck-test:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # lint:migrations の migration-version-before-base-head は「このブランチが
      # 追加したマイグレーションが、base に在るどれよりも後のバージョンか」を見る。
      # actions/checkout は既定で depth 1 なので、これを取らないと base ref が
      # 無く、検査が黙って見送られる（＝本番の db push を止める変更が緑で通る）。
      # tree だけ要るので depth 1 で十分。
      - name: base ブランチを取る（lint:migrations の out-of-order 検査に要る）
        env:
          BASE: ${{ github.base_ref || github.ref_name }}
        run: |
          git fetch --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Security audit (production dependencies)
        # Fails CI when a high or critical CVE is surfaced in prod deps.
        # Moderate/low are tracked separately (see dependabot) and do not
        # block merges.
        run: npm audit --audit-level=high --omit=dev

      # 走らせる検査の一覧はスクリプト側の配列にある。**ここには書かない。**
      # 手元で同じものを `bash scripts/ci-parallel-checks.sh` で再現できる状態を
      # 保つため（CI と手元がずれると、隣のスクリプトで代用が起きる。M-018）。
      #
      # 並列のまま、出力はチェックごとに分けて ::group:: で出し、失敗したものは
      # いちばん最後にもう一度出す。GitHub の API はログの末尾しか返さないので、
      # 末尾に失敗元が写る形にしてある（2026-09-01 に2回誤読しかけた）。
      - name: Lint, Type Check & Unit Tests (parallel)
        # 並列にしたぶん、出力は全部の子プロセスが終わるまで出ない。ハングすると
        # ログが空のまま GitHub の既定（6時間）まで回りつづけるので、上限を切る。
        # 直近の実測は約 4 分（2026-09-04）。PR #1027 の `/code-review` 指摘。
        timeout-minutes: 20
        env:
          # 上で取った base ref を lint:migrations に名指しで渡す（#1025）。
          # PR の base が staging のときも正しく比較できる。
          # スクリプトは子プロセスに env をそのまま継承させるので、ここで渡せば届く
          # （`MIGRATIONS_BASE_REF=origin/main npm run lint:migrations` で実際に確認済み）。
          MIGRATIONS_BASE_REF: origin/${{ github.base_ref || github.ref_name }}
        run: bash scripts/ci-parallel-checks.sh

  migrations-replay:
    name: Migrations Replay
    runs-on: ubuntu-latest
    # マイグレーションを空の PostgreSQL に流し直して、再生できるかを確かめる。
    # 本番だけが持っていて再生できないオブジェクトが 26 列分あった（2026-08-23）。
    # 空 DB から再生できない限り、この種のずれは気づかないまま増え続ける。
    # 3 分ほどかかるので他のチェックとは別ジョブにする
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Start nothing (script boots its own postgres)
        run: |
          # ubuntu-latest には PostgreSQL 16 が入っている。スクリプトが
          # 一時インスタンスを自分で initdb/起動するのでサービスは要らない
          ls /usr/lib/postgresql/
      - run: npm run check:migrations

  bundle-size:
    name: Client Bundle Size
    runs-on: ubuntu-latest
    # PR only — main pushes are already gated by required statuses, and a
    # full next build adds ~3-5 min that we don't want on every direct push.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (production)
        # We only need build-manifest.json to measure the *client* bundle.
        # That manifest is written during the compile phase, which finishes
        # before `next build` moves on to server page-data collection.
        #
        # Page-data collection instantiates clients (Supabase, QStash, Upstash,
        # Stripe, …) at module scope, and those throw without real secrets —
        # which CI deliberately does not provide (no Sentry token either, to
        # skip source-map upload). So `next build` is expected to exit non-zero
        # here on a *post-compile* error. We tolerate that, then assert the
        # manifest exists: a genuine *compile* break emits no manifest and
        # fails this step, while a secrets-only prerender failure does not.
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build || echo "::warning::next build exited non-zero (page-data collection needs runtime secrets CI does not provide); verifying client manifest before continuing"
          if [ ! -f .next/build-manifest.json ]; then
            echo "::error::.next/build-manifest.json missing — client compilation failed (not a secrets issue)"
            exit 1
          fi
      - name: Check client bundle size
        # Default threshold 1200 KB raw bytes (2026-05-30 二段階引き上げ)。
        #
        # 元は 850 KB だったが、PR #399〜#452 で marketing ランディング
        # (Hero / GrowthJourney / TransparencyChart / IntegrationLogoWall 等
        # 25+ コンポーネント) と AI 自動入力基盤の段階導入により root bundle が
        # 自然成長し、複数 PR が連続でこの check を超過する形で merge された。
        # PR #456 で 1000 KB に引き上げたが依然超過したため、本 PR で 1200 KB に
        # 再設定。tripwire の本来の目的「stripe SDK が丸ごと入る」級の事故検出は
        # 維持。
        # 別途 `npm run build:analyze` で .next/analyze/client.html を確認し、
        # 内訳監査 PR を出すこと (本 PR は緊急回避)。
        #
        # 重みのある成長を許す PR は引き続き repo variable CLIENT_BUNDLE_MAX_KB
        # で個別 override 可能。
        env:
          CLIENT_BUNDLE_MAX_KB: ${{ vars.CLIENT_BUNDLE_MAX_KB || '1200' }}
        run: npm run check:bundle-size

  # ponytail: E2E は実 backend (Supabase / Upstash / Stripe) に依存するため
  # secrets 未設定環境ではスキップ。E2E_USER_EMAIL が設定済みの場合のみ実行。
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: lint-typecheck-test
    # ponytail: secrets 未設定なら全スキップ。テストファイル側でも skip する
    # が、Playwright インストール自体を避けるためジョブレベルでもゲート。
    env:
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
    steps:
      - if: env.E2E_USER_EMAIL == ''
        run: echo "::notice::E2E secrets not configured — skipping" && exit 0

      # playwright.config.ts は webServer を起動しない（CI 側で別途起動する前提）。
      # このジョブはアプリを起動しないので、既にデプロイ済みの環境
      # （例: Vercel preview）を指す E2E_BASE_URL が必須。未設定のまま
      # localhost:3000 にフォールバックすると connection-refused で
      # 原因が分かりにくく失敗するため、ここで明示的に弾く。
      - if: env.E2E_USER_EMAIL != '' && env.E2E_BASE_URL == ''
        run: |
          echo "::error::E2E_USER_EMAIL is set but E2E_BASE_URL is not. This job does not start the app — set E2E_BASE_URL to a running deployment (e.g. a Vercel preview URL)."
          exit 1

      - if: env.E2E_USER_EMAIL != '' && env.E2E_BASE_URL != ''
        uses: actions/checkout@v7
      - if: env.E2E_USER_EMAIL != '' && env.E2E_BASE_URL != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: env.E2E_USER_EMAIL != '' && env.E2E_BASE_URL != ''
        run: npm ci
      - if: env.E2E_USER_EMAIL != '' && env.E2E_BASE_URL != ''
        run: npx playwright install --with-deps chromium
      - if: env.E2E_USER_EMAIL != '' && env.E2E_BASE_URL != ''
        name: Run E2E tests
        env:
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_TENANT_SLUG: ${{ secrets.E2E_TENANT_SLUG }}
          E2E_CUSTOMER_PHONE: ${{ secrets.E2E_CUSTOMER_PHONE }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: npx playwright test
      - if: env.E2E_USER_EMAIL != '' && env.E2E_BASE_URL != '' && always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
