name: Supabase Advisors

# Recurring database security/performance advisor baseline (RLS disabled,
# mutable search_path, missing indexes, exposed auth settings, etc.).
# Counterpart to the MCP get_advisors tool. Informational by default; flip the
# script to `--strict` once the baseline is clean to make ERROR-level security
# advisors blocking.
#
# Requires repo secrets:
#   SUPABASE_ACCESS_TOKEN  (Account → Access Tokens)
#   SUPABASE_PROJECT_ID    (project ref)
# When the secrets are absent the script skips gracefully (exit 0).

on:
  schedule:
    - cron: "0 0 * * 1" # weekly, Monday 00:00 UTC
  workflow_dispatch: {}

jobs:
  advisors:
    name: Database advisors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run Supabase advisor check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/check-supabase-advisors.mjs
