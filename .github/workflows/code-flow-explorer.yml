name: Ledra Full Code Explorer
on:
  workflow_dispatch:
  pull_request:
    branches: [main, staging]
permissions:
  contents: read
jobs:
  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax validation
        run: node --check scripts/code-flow-explorer.mjs
      - name: Generate repository code map
        run: node scripts/code-flow-explorer.mjs artifacts/code-flow-explorer.html
      - uses: actions/upload-artifact@v4
        with:
          name: ledra-code-flow-explorer
          path: artifacts/code-flow-explorer.html
          retention-days: 14
