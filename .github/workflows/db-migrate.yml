name: DB migrate (apply to production)

# main に supabase/migrations/** の変更が入ったら、未適用のマイグレーションを
# 本番 DB へ自動適用する。手動実行 (workflow_dispatch) も可能。
#
# 必要な GitHub Secrets:
#   - SUPABASE_ACCESS_TOKEN … CLI 認証用 (db-typegen で既に使用)
#   - SUPABASE_PROJECT_ID   … プロジェクト ref (db-typegen で既に使用)
#   - SUPABASE_DB_PASSWORD  … 本番DBパスワード ★このワークフロー用に新規追加が必要
#     (Supabase ダッシュボード → Project Settings → Database → Database password)
#
# 安全メモ: main マージで本番へ自動適用される。ゲートしたい場合は本ジョブに
# `environment: production` を付け、その Environment に必須レビュアーを設定する。

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# 複数の適用が並走しないよう直列化する (本番DBへの適用は同時に走らせない)。
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Apply pending migrations (supabase db push)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # このリポジトリには supabase/config.toml が無いため、CLI 用に最小構成を用意する
          # (既存の supabase/migrations は保持される)。
          if [ ! -f supabase/config.toml ]; then
            supabase init || printf 'project_id = "ledra"\n' > supabase/config.toml
          fi
          # リモート (本番) プロジェクトに紐付け。
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          # まず適用予定を出力 (可視化)。失敗しても続行はしない。
          echo "== pending migrations =="
          supabase migration list --linked || true
          # 未適用のマイグレーションのみ本番へ適用する。既存の投入データ系マイグレーションは
          # ON CONFLICT DO NOTHING 等で冪等に書く運用のため、再実行されても安全。
          supabase db push
