name: DB migrate (apply to production)

# main に supabase/migrations/** の変更が入ったら、未適用のマイグレーションを
# 本番 DB へ自動適用する。手動実行 (workflow_dispatch) も可能。
#
# 必要な GitHub Secret (1 本だけ):
#   - SUPABASE_DB_URL … 本番DBの接続URI (パスワード込み)。
#     Supabase ダッシュボード → Connect → "Session pooler" の URI をそのまま登録する
#     (末尾 :5432 のセッションモード。[YOUR-PASSWORD] は実際のDBパスワードに置換)。
#     例: postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#
#   接続URI 方式にしている理由: link 方式は SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_ID が
#   別途必要だが、それらが未設定で初回失敗した。--db-url ならこの 1 本で完結し、
#   ダッシュボードからコピペするだけで済む (project ref / region / エンコード不要)。
#
# 安全メモ: main マージで本番へ自動適用される。ゲートしたい場合は本ジョブに
# `environment: production` を付け、その Environment に必須レビュアーを設定する。

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# 複数の適用が並走しないよう直列化する (本番DBへの適用は同時に走らせない)。
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Apply pending migrations (supabase db push)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret が未設定です。Supabase ダッシュボード → Connect → Session pooler の接続URI(パスワード込み)を登録してください。"
            exit 1
          fi
          # このリポジトリには supabase/config.toml が無いため CLI 用に最小構成を用意する
          # (既存の supabase/migrations は保持される)。
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          # 適用予定を可視化 (失敗しても続行はしない)。
          echo "== pending migrations =="
          supabase migration list --db-url "$SUPABASE_DB_URL" || true
          # 未適用のマイグレーションのみ本番へ適用。投入データ系は ON CONFLICT DO NOTHING 等で
          # 冪等に書く運用のため再実行にも耐える。
          #
          # このジョブが緑であり続けるための不変条件が2つある。どちらも破ると
          # push が exit 1 で止まり、以降のマイグレーションが自動適用されなくなる
          # (2026-08-02〜08-15 に実際に発生し、証明書発行が全件停止した):
          #
          #   1. 本番 schema_migrations にあるバージョンは、必ず同じバージョンの
          #      ファイルが supabase/migrations に存在すること。
          #      無いと "Remote migration versions not found in local migrations
          #      directory." で停止する。Supabase MCP の apply_migration で本番へ
          #      直接当てたときは、必ず同バージョン名のファイルを repo にも足す。
          #   2. 新しいマイグレーションのタイムスタンプは、本番へ適用済みの最新
          #      バージョンより後にすること。古い日付を後から入れると
          #      out-of-order として停止する (--include-all で強制適用もできるが、
          #      順序不変性が崩れ他環境の再現性が濁るため DECISION_LOG 2026-07-21 で
          #      不採用。後発ファイルを一意な後ろの日付へ改名する運用に統一する)。
          #      **改名してよいのは本番に無いバージョンだけ。** 改名の前に必ず
          #      本番の台帳をバージョン名で名指しして引く:
          #        select version from supabase_migrations.schema_migrations
          #         where version = '<改名したいバージョン>';
          #      降順 LIMIT で代用しない (小さいバージョンは枠外に落ちる)。
          #      適用済みを改名すると条件1を壊し、次の run が別のエラーで止まる。
          #      2026-08-25 の audit_logs_reconcile と 2026-08-26 の VIN トリガーで
          #      2回起きている。
          supabase db push --db-url "$SUPABASE_DB_URL"

      # 本番台帳の要約 (supabase/migrations.production-ledger) が古くなっていないか見る。
      #
      # なぜ要るか: lint の migration-version-before-base-head は、しきい値に
      # 「base(main) の最新」と「この台帳の max:」の大きい方を使う。**台帳が古いと
      # しきい値が base だけに落ち、それは #1020 を通してしまった当時の検査そのもの**
      # ——つまり古い台帳は「誤検出が出るだけ」ではなく **見逃しを生む**
      # (MISTAKE_LEDGER M-061、この誤りを最初 4 つの文書に書いていた)。
      #
      # ここでしか見られない理由: 正確な判定には本番への接続が要る。CI(ci.yml)は
      # 本番の資格情報を持たないが、このワークフローは持っている。
      #
      # **push の後に置く。** 台帳の古さでマイグレーションの適用を止めては本末転倒。
      # 適用は済ませたうえで、ジョブを赤くして更新を促す。
      #
      # 天井: apply_migration で本番へ直接当てた直後から、次にこのワークフローが
      # 走るまでの間は誰も見ていない。その窓を閉じるには定期実行か、直接適用の運用を
      # やめるかが要る (OPEN_QUESTIONS)。
      - name: 本番台帳の要約が古くないか確認
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          ledger="supabase/migrations.production-ledger"
          # `max: <14桁>` の行から値を取る (コメント行は無視)。無ければ 0 扱い。
          recorded=0
          if [ -f "$ledger" ]; then
            recorded=$(grep -E '^max:[[:space:]]*[0-9]{14}$' "$ledger" | head -1 | tr -cd '0-9')
            recorded=${recorded:-0}
          fi
          # repo が持っている最新のマイグレーション版 (= lint の base 側しきい値)。
          repo_max=$(ls supabase/migrations/*.sql 2>/dev/null | xargs -r -n1 basename \
            | grep -oE '^[0-9]{14}' | sort | tail -1)
          # 本番の適用済み最新。migration list の Remote 列から 14 桁だけを拾う。
          actual=$(supabase migration list --db-url "$SUPABASE_DB_URL" \
            | awk -F'|' 'NF>=2 { gsub(/[^0-9]/, "", $2); if (length($2)==14) print $2 }' \
            | sort | tail -1)
          echo "本番の最新: ${actual:-（取得できず）} / repo の最新: ${repo_max:-（無し）} / 台帳の max: $recorded"
          if [ -z "$actual" ]; then
            echo "::error::本番の適用済み最新を取得できませんでした。migration list の出力形式が変わった可能性があります。"
            exit 1
          fi
          # 台帳が要るのは **本番が repo より先に進んでいるとき** だけ。
          # 通常の push 成功後は 本番 == repo なので、ここは静かに通る
          # (毎回赤くすると「赤いのが普通」になり、13日間の見落としを再生産する)。
          if [ "$actual" \> "$repo_max" ] && [ "$actual" \> "$recorded" ]; then
            echo "::error::本番に repo より新しい版 $actual があり、$ledger にも記録されていません（台帳 $recorded）。この状態だと out-of-order 検査のしきい値が repo 側に落ち、古い版の追加を **見逃します**（#1020 と同じ形）。$ledger の max: を $actual に更新し、その版のファイルを main へ補ってください。"
            exit 1
          fi
          echo "ok"

      # 失敗したら Slack へ通知する。
      #
      # なぜ要るか: このジョブは 2026-08-02 から 08-15 までの13日間ずっと赤で、
      # その間マイグレーションが一切自動適用されていなかった。気づいたのは
      # 「証明書が発行できない」という本番障害の調査中で、赤かったこと自体は
      # 誰も見ていなかった (DECISION_LOG 2026-07-21 でも「失敗の可視化(通知)も
      # 要検討」と書かれたまま放置されていた)。ここが赤いまま放置されると、
      # 以降のスキーマ変更が全部本番に届かなくなるため影響が大きい。
      #
      # 通知先は記事ドラフト通知 (notify-article-pr.yml) と同じ SLACK_WEBHOOK_URL を
      # 流用する。新しいシークレットも仕組みも増やさない。
      #
      # if: failure() なので push 成功時は何も送らない (成功通知はノイズになるため出さない)。
      #
      # このステップは「自分が失敗したことを自分で報告できない」構造になりやすい。
      # それはまさにこのPRで直そうとしている「誰も気づかない」の再生産なので、
      # 配信できなかったら必ずステップを赤くする:
      #   - set -euo pipefail  … jq が失敗したときに空ボディを POST して緑で終わるのを防ぐ
      #   - curl --fail-with-body … Slack は無効な webhook にも HTTP 4xx + 本文を返す。
      #                             --fail 系が無いと curl は exit 0 で、未配信に気づけない
      #   - continue-on-error は付けない … このステップは if: failure() でしか動かず、
      #     その時点でジョブの結論は既に failure。つまりジョブを緑に見せる余地は元々無く、
      #     付けても「通知ステップ自身の失敗を隠す」効果しか無い
      - name: 失敗を Slack に通知
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # workflow_dispatch では head_commit が無く null になる (マイグレーションを直した後の
          # 再実行はまさにこの経路) ため、その場合は SHA にフォールバックする
          COMMIT_MSG: ${{ github.event.head_commit.message || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL が未設定のため通知をスキップしました。"
            exit 0
          fi
          # 長いコミットメッセージは1行目だけにする。
          # printf | head だと巨大なメッセージで printf が SIGPIPE を受け、pipefail と併せて
          # ここで落ちうるので、パイプを使わないパラメータ展開で切る。
          title=${COMMIT_MSG%%$'\n'*}
          # ヒント文は **必ず --arg で渡す**。jq プログラムはシングルクォートで囲むので、
          # プログラム本文に `'` を書くとそこで文字列が終わり、続きがシェルとして解釈される。
          # 実際 `where version = '<対象>'` の `'` でこのステップは毎回落ちており、
          # 「本番の適用が止まった」通知が一度も届いていなかった（MISTAKE_LEDGER M-062）。
          hint="よくある原因: (1) 本番 schema_migrations にあるバージョンのファイルが repo に無い → 該当ファイルを追加する。(2) 新しいマイグレーションの日付が適用済み最新より古い (out-of-order) → 後ろの日付へ改名する。*ただし改名してよいのは本番に無いバージョンだけ。* 改名前に schema_migrations をバージョン名で名指しして引くこと（降順 LIMIT で代用しない）。適用済みを改名すると条件1を壊し、次の run が別のエラーで止まる — 2026-08 に2回起きている。"
          payload=$(jq -n \
            --arg run "$RUN_URL" \
            --arg title "$title" \
            --arg hint "$hint" \
            '{
              blocks: [
                { type: "header",
                  text: { type: "plain_text", text: "🔴 本番DBマイグレーションが失敗しました" } },
                { type: "section",
                  text: { type: "mrkdwn",
                    text: ("*このまま放置すると、以降のスキーマ変更が本番に届きません。*\n直近のコミット: " + $title) } },
                { type: "context", elements: [
                  { type: "mrkdwn", text: $hint }
                ] },
                { type: "actions", elements: [
                  { type: "button", style: "danger",
                    text: { type: "plain_text", text: "実行ログを見る" }, url: $run }
                ] }
              ]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK_URL"
