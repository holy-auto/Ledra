name: Stale migration dates

# レビュー待ちが長い PR のマイグレーション日付が陳腐化していないかを毎日見る。
#
# ## なぜ要るか
#
# `lint:migrations` の `migration-version-before-base-head` は
# 「このブランチが追加したファイルが base の最新より後か」を見る。**PR の CI が
# 走った時点では正しかった**日付が、その後 main に別のマイグレーションが入ると
# 追い越されて out-of-order になる。
#
# ところが **push が無い間 CI は再実行されない**ので、追い越されたことに気づくのは
# 次の push かマージ直前になる。このリポジトリで4回起きている（OPEN_QUESTIONS）。
# 2026-08-02〜08-15 は13日間 db push が止まり、証明書発行が全件停止した。
#
# 代表判断 2026-09-05: 案(b)（一定日数を超えた PR で日付を再チェックする CI）を採る。
# 案(a)（採番をマージ直前にする運用）は、採番のたびに人手が要り運用が崩れると
# 判定が効かなくなるため取らなかった。DECISION_LOG 2026-09-05。
#
# ## 何をしているか
#
# 判定ロジックは**書かない**。PR の head を checkout して、CI と同じ
# `npm run lint:migrations` を `MIGRATIONS_BASE_REF=origin/main` で回すだけ。
# 検査を2箇所に書くと必ず片方だけ直る（MISTAKE_LEDGER 型 C）。

on:
  schedule:
    # 毎日 00:20 UTC（JST 09:20）。朝いちばんで気づける。
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      min_age_days:
        description: "この日数より長く開いている PR を対象にする"
        required: false
        default: "3"

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: 陳腐化した日付を探す
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 対象 PR を洗い出して1本ずつ検査する
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_AGE_DAYS: ${{ github.event.inputs.min_age_days || '3' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # マージ先が main の open PR のうち、supabase/migrations を触っていて、
          # 開いてから MIN_AGE_DAYS 日を超えたもの。
          cutoff="$(date -u -d "-${MIN_AGE_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          echo "対象: $cutoff より前に開かれた open PR"

          gh pr list --repo "$REPO" --base main --state open --limit 100 \
            --json number,headRefName,createdAt,isDraft,title > prs.json

          jq -r --arg cutoff "$cutoff" \
            '.[] | select(.createdAt < $cutoff) | "\(.number)\t\(.headRefName)\t\(.isDraft)\t\(.title)"' \
            prs.json > candidates.tsv || true

          if [ ! -s candidates.tsv ]; then
            echo "::notice::対象の PR はありません"
            exit 0
          fi

          stale=0
          while IFS=$'\t' read -r num branch draft title; do
            [ -n "$num" ] || continue

            # マイグレーションを触っていない PR は見ない。
            if ! gh pr diff "$num" --repo "$REPO" --name-only | grep -q '^supabase/migrations/'; then
              continue
            fi

            echo "::group::PR #$num ($branch) — $title"
            git fetch --quiet origin "refs/pull/$num/head:pr-$num" || { echo "head を取れず"; echo "::endgroup::"; continue; }
            git checkout --quiet "pr-$num"

            # CI と同じ検査をそのまま回す。判定はここに書かない。
            if MIGRATIONS_BASE_REF=origin/main node scripts/lint-migrations.js; then
              echo "OK"
            else
              stale=$((stale + 1))
              echo "::warning::PR #$num のマイグレーション日付が main に追い越されています"

              # 同じ内容を毎日貼らない。既に貼ってあれば黙る。
              # 本文は .github/stale-migration-comment.md に置く。
              # run: | の中にヒアドキュメントで書くと、本文の行が列0に出て
              # YAML のブロックスカラーを抜けてしまう（実際に一度そうなった）。
              body=".github/stale-migration-comment.md"
              marker="$(head -1 "$body")"
              if ! gh pr view "$num" --repo "$REPO" --json comments \
                   --jq '.comments[].body' | grep -qF "$marker"; then
                gh pr comment "$num" --repo "$REPO" --body-file "$body"
              fi
            fi
            git checkout --quiet -
            echo "::endgroup::"
          done < candidates.tsv

          echo "追い越されていた PR: $stale 本"
