name: Mobile CI

on:
  push:
    branches: [main, staging]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  typecheck-test:
    name: Mobile Typecheck & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        # vitest 導入後にテストが存在する。スクリプト未定義の旧コミットは exit 0 で通す。
        run: npm test --if-present

      # ここから下はネイティブ設定の検査。フルビルドの代わりではないが、
      # 「17分ビルドして manifest merger で初めて分かる」クラスの事故を数秒で拾う。
      - name: Prebuild (Android)
        # app.json の設定ミス、参照アセットの欠落、自作 config plugin
        # (withNfcLocal / withRemoveTapToPayEntitlement) の例外はここで落ちる。
        # android/ は .gitignore 済み。prebuild は package.json も書き換えるが、
        # このチェックアウトは使い捨てなので放置してよい。
        run: npx expo prebuild --platform android --no-install

      - name: ネイティブ依存の minSdk 整合を検査
        # app.json の minSdk と node_modules/*/android/build.gradle(.kts) の宣言を突き合わせる。
        # prebuild の後に置くのは、app.json に設定が無い場合に android/gradle.properties から
        # 解決後の値を読めるようにするため。
        run: npm run check:native
